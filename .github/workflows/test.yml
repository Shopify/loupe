name: Run tests
on: [push, pull_request]

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@17c4a42132dd491d3fdb7ac56549fc1404125c96 # 1.58
        with:
          components: rustfmt
      - run: cargo test
      - run: cargo run
      #- run: cargo fmt --check
