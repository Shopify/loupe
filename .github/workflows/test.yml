name: Run tests
on: [push, pull_request]

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@17c4a42132dd491d3fdb7ac56549fc1404125c96 # 1.58
        with:
          components: rustfmt
      - run: cargo test
      - run: cargo run
      #- run: cargo fmt --check
