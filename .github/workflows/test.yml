name: Run tests
on: [push, pull_request]

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@17c4a42132dd491d3fdb7ac56549fc1404125c96 # 1.58
        with:
          components: rustfmt
      - run: cargo test
      - run: cargo run
      #- run: cargo fmt --check
